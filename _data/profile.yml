name: Shengli Zhu
name_full: Shengli Zhu (Victor, 朱胜利)
photo: /assets/img/profile.jpg
bio: >-
  I am a PhD student in hydrology at KAUST, working with Prof. Hylke Beck. My research focuses on how to observe
  precipitation, how it turns into streamflow in catchment, and how well hydrological models and machine learning can
  predict streamflow at global scale. For my master's study I simulated the hydrological processes of the Source Region
  of the Yellow River on the Tibetan Plateau with satellite precipitation products.
