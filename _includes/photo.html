{%- assign meta = site.data.photos[include.src] -%}
{%- assign cap = include.alt | split: "- " | last | strip -%}
<figure class="photo">
  <img src="{{ '/assets/img/blog/' | append: include.src | append: '-1600.jpg' | relative_url }}"
       srcset="{{ '/assets/img/blog/' | append: include.src | append: '-800.jpg' | relative_url }} 800w, {{ '/assets/img/blog/' | append: include.src | append: '-1600.jpg' | relative_url }} 1600w"
       sizes="(min-width: 900px) 760px, 100vw" width="{{ meta.w }}" height="{{ meta.h }}" loading="lazy" decoding="async" alt="{{ include.alt }}">
  {%- unless cap contains "Photo" %}<figcaption>{{ cap }}</figcaption>{% endunless -%}
</figure>
